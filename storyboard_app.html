<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꼬마 작가의 스토리보드 🎨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Gowun Dodum -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <!-- Tone.js for cute UI sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #FFFBEB;
            color: #451A03;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        h1, h2, h3, .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Jelly bounce animation for kid-friendly buttons */
        .btn-jelly {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .btn-jelly:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.03);
        }
        .btn-jelly:active:not(:disabled) {
            transform: translateY(2px) scale(0.95);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FEF3C7;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #F59E0B;
            border-radius: 10px;
        }
        canvas {
            touch-action: none;
        }
        .sticker-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            transform-origin: center center;
            transition: filter 0.1s;
        }
        .sticker-item:active {
            cursor: grabbing;
        }
        .sticker-item.selected {
            outline: 3px dashed #F97316;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.3);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-amber-400 text-amber-950 px-4 py-3 shadow-md flex flex-wrap items-center justify-between gap-2 border-b-4 border-amber-500">
        <div class="flex items-center gap-3">
            <span class="text-3xl bg-white p-1.5 rounded-2xl shadow-sm">🎨</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-jua tracking-wide text-amber-950">꼬마 작가의 스토리보드</h1>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <button onclick="playPop(); toggleSound()" id="soundToggleBtn" class="btn-jelly bg-amber-100 hover:bg-white text-amber-900 px-3 py-2 rounded-2xl font-jua text-base md:text-lg shadow flex items-center gap-1.5 border-2 border-amber-300" title="효과음 켜기/끄기">
                <span id="soundIcon">🔊</span>
                <span class="hidden sm:inline">소리 켜짐</span>
            </button>
            <button onclick="playPop(); exportToPDF()" id="headerPdfBtn" class="btn-jelly bg-rose-500 hover:bg-rose-400 text-white px-3.5 py-2.5 rounded-2xl font-jua text-base md:text-xl shadow-md flex items-center gap-1.5 border-b-4 border-rose-700">
                <span>📄</span>
                <span>PDF 저장</span>
            </button>
            <button onclick="playPop(); openStorybookModal()" class="btn-jelly bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-2.5 rounded-2xl font-jua text-base md:text-xl shadow-md flex items-center gap-1.5 border-b-4 border-emerald-700">
                <span>📖</span>
                <span>동화책 보기</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-5 flex flex-col lg:flex-row gap-4 md:gap-6">
        
        <!-- Left & Center: Drawing & Story Editor -->
        <section class="flex-1 flex flex-col gap-3 bg-white rounded-3xl p-4 shadow-lg border-4 border-amber-200">
            
            <!-- Scene Header & Tools -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b-2 border-amber-100">
                <div class="flex items-center gap-2">
                    <span id="currentSceneBadge" class="bg-orange-500 text-white font-jua text-xl px-4 py-1 rounded-full shadow-sm">1번째 장면</span>
                    <span class="text-sm text-amber-700 font-bold hidden sm:inline">그림을 그리고 스티커를 붙여보세요!</span>
                </div>
                
                <!-- Tool Mode Tabs -->
                <div class="flex bg-amber-100 p-1 rounded-2xl gap-1">
                    <button onclick="playPop(); setTool('pen')" id="toolPen" class="btn-jelly px-3 py-1.5 rounded-xl font-jua text-base md:text-lg flex items-center gap-1 bg-amber-500 text-white shadow">
                        <span>🖍️</span> 그리기
                    </button>
                    <button onclick="playPop(); setTool('eraser')" id="toolEraser" class="btn-jelly px-3 py-1.5 rounded-xl font-jua text-base md:text-lg flex items-center gap-1 text-amber-900 hover:bg-amber-200">
                        <span>🧽</span> 지우개
                    </button>
                    <button onclick="playPop(); toggleStickerDrawer()" id="toolSticker" class="btn-jelly px-3 py-1.5 rounded-xl font-jua text-base md:text-lg flex items-center gap-1 text-amber-900 hover:bg-amber-200">
                        <span>🦁</span> 스티커
                    </button>
                    <button onclick="playPop(); clearCurrentCanvas()" class="btn-jelly px-3 py-1.5 rounded-xl font-jua text-base md:text-lg flex items-center gap-1 text-rose-600 hover:bg-rose-100" title="모두 지우기">
                        <span>🗑️</span> 비우기
                    </button>
                </div>
            </div>

            <!-- Color Palette & Brush Size -->
            <div id="drawingControls" class="flex flex-wrap items-center justify-between gap-3 bg-amber-50 p-2.5 rounded-2xl border border-amber-200">
                <!-- 10 Crayon Colors -->
                <div class="flex flex-wrap items-center gap-1.5 md:gap-2" id="colorPalette">
                    <!-- Colors injected by JS -->
                </div>
                <!-- 3 Brush Sizes -->
                <div class="flex items-center gap-2 bg-white px-3 py-1 rounded-xl border border-amber-200">
                    <span class="text-xs font-bold text-amber-800">굵기</span>
                    <button onclick="playPop(); setBrushSize(5)" id="sizeSmall" class="btn-jelly w-7 h-7 rounded-full flex items-center justify-center hover:bg-amber-100">
                        <span class="w-2 h-2 rounded-full bg-amber-950"></span>
                    </button>
                    <button onclick="playPop(); setBrushSize(12)" id="sizeMedium" class="btn-jelly w-8 h-8 rounded-full flex items-center justify-center bg-amber-200 ring-2 ring-amber-500">
                        <span class="w-4 h-4 rounded-full bg-amber-950"></span>
                    </button>
                    <button onclick="playPop(); setBrushSize(24)" id="sizeLarge" class="btn-jelly w-9 h-9 rounded-full flex items-center justify-center hover:bg-amber-100">
                        <span class="w-6 h-6 rounded-full bg-amber-950"></span>
                    </button>
                </div>
            </div>

            <!-- Sticker Drawer (Hidden by default) -->
            <div id="stickerDrawer" class="hidden bg-orange-50 p-3 rounded-2xl border-2 border-orange-200">
                <div class="flex items-center justify-between mb-2">
                    <span class="font-jua text-orange-800 text-lg">✨ 붙이고 싶은 스티커를 눌러보세요!</span>
                    <div id="selectedStickerControls" class="hidden flex items-center gap-1.5">
                        <button onclick="playPop(); scaleSelectedSticker(1.2)" class="btn-jelly bg-white px-2.5 py-1 rounded-xl text-sm font-bold border border-orange-300 shadow-sm">크게 ➕</button>
                        <button onclick="playPop(); scaleSelectedSticker(0.8)" class="btn-jelly bg-white px-2.5 py-1 rounded-xl text-sm font-bold border border-orange-300 shadow-sm">작게 ➖</button>
                        <button onclick="playPop(); deleteSelectedSticker()" class="btn-jelly bg-rose-500 text-white px-2.5 py-1 rounded-xl text-sm font-bold shadow-sm">삭제 ❌</button>
                    </div>
                </div>
                <div id="stickerGrid" class="grid grid-cols-6 sm:grid-cols-9 md:grid-cols-12 gap-1.5 max-h-32 overflow-y-auto p-1">
                    <!-- Stickers injected by JS -->
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvasWrapper" class="relative w-full aspect-[4/3] bg-white rounded-2xl border-4 border-dashed border-amber-300 overflow-hidden shadow-inner">
                <canvas id="drawingCanvas" class="w-full h-full block cursor-crosshair"></canvas>
                <div id="stickerLayer" class="absolute inset-0 pointer-events-none">
                    <!-- Placed stickers appear here -->
                </div>
            </div>

            <!-- Story Text & Voice Recorder -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 pt-1">
                <div class="md:col-span-8 flex flex-col">
                    <label for="sceneText" class="font-jua text-amber-900 text-lg mb-1 flex items-center gap-1">
                        <span>✏️</span> 어떤 이야기인가요?
                    </label>
                    <textarea id="sceneText" rows="2" oninput="updateSceneText(this.value)" placeholder="여기에 이야기를 쓰거나 오른쪽 마이크 버튼으로 목소리를 녹음해요!" class="w-full p-3 rounded-2xl border-2 border-amber-300 focus:border-orange-500 focus:outline-none text-lg bg-amber-50/50 resize-none"></textarea>
                </div>
                
                <!-- Voice Recording Box -->
                <div class="md:col-span-4 bg-sky-50 rounded-2xl p-3 border-2 border-sky-200 flex flex-col justify-between">
                    <span class="font-jua text-sky-900 text-lg flex items-center gap-1">
                        <span>🎤</span> 목소리 녹음
                    </span>
                    <div class="flex items-center gap-2 mt-2">
                        <button onclick="toggleRecording()" id="recordBtn" class="btn-jelly flex-1 bg-rose-500 hover:bg-rose-600 text-white py-2.5 px-3 rounded-xl font-jua text-base shadow flex items-center justify-center gap-1.5">
                            <span id="recordIcon">🎙️</span>
                            <span id="recordLabel">녹음하기</span>
                        </button>
                        <button onclick="playPop(); playRecordedAudio()" id="playAudioBtn" disabled class="btn-jelly bg-sky-500 disabled:bg-gray-300 text-white p-2.5 rounded-xl font-jua shadow flex items-center justify-center" title="녹음 듣기">
                            <span>▶️</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Sidebar: Storyboard Scenes List -->
        <aside class="w-full lg:w-80 bg-white rounded-3xl p-4 shadow-lg border-4 border-amber-200 flex flex-col gap-3">
            <div class="flex items-center justify-between border-b-2 border-amber-100 pb-2">
                <h2 class="font-jua text-xl text-amber-950 flex items-center gap-1.5">
                    <span>🎞️</span> 이야기 순서
                </h2>
                <button onclick="playPop(); addScene()" class="btn-jelly bg-amber-400 hover:bg-amber-500 text-amber-950 px-3 py-1.5 rounded-xl font-jua text-base shadow-sm flex items-center gap-1">
                    <span>➕</span> 장면 추가
                </button>
            </div>
            
            <div id="sceneList" class="flex lg:flex-col gap-3 overflow-x-auto lg:overflow-y-auto lg:max-h-[620px] pb-2 lg:pb-0">
                <!-- Scene thumbnails injected by JS -->
            </div>
        </aside>
    </main>

    <!-- Storybook Presentation Modal (Improved viewport fitting) -->
    <div id="storybookModal" class="fixed inset-0 bg-amber-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div class="bg-amber-50 w-full max-w-4xl rounded-3xl shadow-2xl border-4 sm:border-8 border-amber-400 overflow-hidden flex flex-col max-h-[95vh]">
            <!-- Modal Header (Fixed height) -->
            <div class="bg-amber-400 px-4 py-2.5 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">📖</span>
                    <h2 class="font-jua text-xl sm:text-2xl text-amber-950">나의 동화책 발표하기</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="playPop(); exportToPDF()" class="btn-jelly bg-rose-500 hover:bg-rose-400 text-white px-3 py-1.5 rounded-xl font-jua text-base sm:text-lg shadow flex items-center gap-1 border-b-2 border-rose-700">
                        <span>📄</span>
                        <span>PDF 저장</span>
                    </button>
                    <button onclick="playPop(); closeStorybookModal()" class="btn-jelly bg-white text-amber-950 w-9 h-9 sm:w-10 sm:h-10 rounded-full font-jua text-lg sm:text-xl shadow flex items-center justify-center">✖</button>
                </div>
            </div>

            <!-- Book Page Content (Flexible scrollable middle area) -->
            <div class="flex-1 min-h-0 p-3 sm:p-4 overflow-y-auto flex flex-col items-center justify-center gap-3">
                <div class="relative w-full max-w-lg h-[36vh] sm:h-[42vh] bg-white rounded-2xl shadow-md border-4 border-amber-200 overflow-hidden flex items-center justify-center shrink-0">
                    <img id="modalSceneImg" src="" alt="장면 그림" class="max-w-full max-h-full object-contain">
                    <span id="modalPageBadge" class="absolute top-2.5 left-2.5 bg-orange-500 text-white font-jua px-3 py-0.5 rounded-full text-base sm:text-lg shadow">1 / 4</span>
                </div>

                <div class="w-full max-w-2xl bg-white p-3 sm:p-4 rounded-2xl border-2 border-amber-200 shadow-sm text-center shrink-0">
                    <p id="modalSceneText" class="text-lg sm:text-2xl font-bold text-amber-950 leading-relaxed min-h-[2.5rem] flex items-center justify-center">
                        이야기 내용이 여기에 나옵니다.
                    </p>
                </div>
            </div>

            <!-- Modal Navigation & Audio Controls (Always visible pinned footer) -->
            <div class="bg-amber-100 px-3 sm:px-6 py-3 flex items-center justify-between gap-2 border-t-2 border-amber-300 shrink-0">
                <button onclick="playPop(); prevModalScene()" id="modalPrevBtn" class="btn-jelly bg-white hover:bg-amber-200 disabled:opacity-40 disabled:cursor-not-allowed text-amber-950 px-3.5 sm:px-5 py-2.5 rounded-2xl font-jua text-base sm:text-xl shadow border-2 border-amber-300 flex items-center gap-1">
                    <span>⬅️</span>
                    <span>이전 장면</span>
                </button>

                <button onclick="playModalVoiceOrTTS()" id="modalListenBtn" class="btn-jelly bg-sky-500 hover:bg-sky-400 text-white px-4 sm:px-6 py-2.5 sm:py-3 rounded-2xl font-jua text-base sm:text-xl shadow-md flex items-center gap-1.5 border-b-4 border-sky-700">
                    <span>🔊</span>
                    <span id="modalListenLabel">이야기 듣기</span>
                </button>

                <button onclick="playPop(); nextModalScene()" id="modalNextBtn" class="btn-jelly bg-orange-500 hover:bg-orange-400 disabled:opacity-40 disabled:cursor-not-allowed text-white px-3.5 sm:px-5 py-2.5 rounded-2xl font-jua text-base sm:text-xl shadow border-b-4 border-orange-700 flex items-center gap-1">
                    <span>다음 장면</span>
                    <span>➡️</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Audio & Sound Effects (Tone.js) ---
        let soundEnabled = true;
        let synth = null;

        function initAudio() {
            if (!synth && window.Tone) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 0.2 }
                }).toDestination();
            }
        }

        function playPop() {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (Tone.context.state !== 'running') Tone.start();
                synth.triggerAttackRelease("C5", "16n");
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                icon.textContent = '🔊';
                btn.innerHTML = '<span>🔊</span><span class="hidden sm:inline">소리 켜짐</span>';
            } else {
                icon.textContent = '🔇';
                btn.innerHTML = '<span>🔇</span><span class="hidden sm:inline">소리 꺼짐</span>';
            }
        }

        // --- App State ---
        const COLORS = [
            { name: '검정', hex: '#1E293B' },
            { name: '빨강', hex: '#EF4444' },
            { name: '주황', hex: '#F97316' },
            { name: '노랑', hex: '#EAB308' },
            { name: '초록', hex: '#22C55E' },
            { name: '하늘', hex: '#0EA5E9' },
            { name: '파랑', hex: '#3B82F6' },
            { name: '보라', hex: '#A855F7' },
            { name: '분홍', hex: '#EC4899' },
            { name: '갈색', hex: '#92400E' }
        ];

        const STICKERS = [
            '🐶','🐱','🐰','🐻','🦊','🦁','🐯','🐸','🐵','🐧','🐤','🦄',
            '👦','👧','👵','👴','👑','🤖','👻','👽','🧚','🦸','🧜‍♀️','🧙‍♂️',
            '☀️','🌙','⭐','☁️','🌈','🌸','🌳','🍎','🍰','🚗','🚀','🏠'
        ];

        let scenes = [
            createEmptyScene('옛날 옛적에 귀여운 강아지가 살았어요.'),
            createEmptyScene('강아지는 친구들과 숲속으로 소풍을 갔어요.'),
            createEmptyScene('갑자기 비가 내려서 큰 나뭇잎 우산을 썼어요.'),
            createEmptyScene('무지개가 떠서 모두가 행복하게 웃었답니다!')
        ];
        let currentSceneIndex = 0;
        let currentTool = 'pen';
        let currentColor = COLORS[0].hex;
        let brushSize = 12;
        let isDrawing = false;
        let selectedStickerId = null;

        // Canvas elements
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const stickerLayer = document.getElementById('stickerLayer');

        function createEmptyScene(defaultText = '') {
            return {
                id: Date.now() + Math.random(),
                drawingDataUrl: null,
                stickers: [], // { id, emoji, x, y, scale }
                text: defaultText,
                audioUrl: null
            };
        }

        // --- Initialization ---
        function init() {
            renderColorPalette();
            renderStickerGrid();
            resizeCanvas();
            window.addEventListener('resize', () => {
                saveCurrentDrawing();
                resizeCanvas();
                loadScene(currentSceneIndex);
            });
            setupCanvasEvents();
            loadScene(0);
            renderSceneList();
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            const rect = wrapper.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function renderColorPalette() {
            const container = document.getElementById('colorPalette');
            container.innerHTML = '';
            COLORS.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `btn-jelly w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-white shadow-sm transition-transform ${currentColor === c.hex ? 'ring-4 ring-amber-400 scale-110' : ''}`;
                btn.style.backgroundColor = c.hex;
                btn.title = c.name;
                btn.onclick = () => {
                    playPop();
                    currentColor = c.hex;
                    setTool('pen');
                    renderColorPalette();
                };
                container.appendChild(btn);
            });
        }

        function renderStickerGrid() {
            const grid = document.getElementById('stickerGrid');
            grid.innerHTML = '';
            STICKERS.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'btn-jelly text-2xl md:text-3xl p-1.5 bg-white rounded-xl hover:bg-amber-100 shadow-sm border border-orange-100 flex items-center justify-center';
                btn.textContent = emoji;
                btn.onclick = () => {
                    playPop();
                    addStickerToScene(emoji);
                };
                grid.appendChild(btn);
            });
        }

        // --- Drawing Logic ---
        function setTool(tool) {
            currentTool = tool;
            const penBtn = document.getElementById('toolPen');
            const eraserBtn = document.getElementById('toolEraser');
            const stickerBtn = document.getElementById('toolSticker');

            [penBtn, eraserBtn, stickerBtn].forEach(b => {
                b.classList.remove('bg-amber-500', 'text-white', 'shadow');
                b.classList.add('text-amber-900');
            });

            if (tool === 'pen') {
                penBtn.classList.add('bg-amber-500', 'text-white', 'shadow');
                penBtn.classList.remove('text-amber-900');
                stickerLayer.style.pointerEvents = 'none';
                deselectSticker();
            } else if (tool === 'eraser') {
                eraserBtn.classList.add('bg-amber-500', 'text-white', 'shadow');
                eraserBtn.classList.remove('text-amber-900');
                stickerLayer.style.pointerEvents = 'none';
                deselectSticker();
            } else if (tool === 'sticker') {
                stickerBtn.classList.add('bg-amber-500', 'text-white', 'shadow');
                stickerBtn.classList.remove('text-amber-900');
                stickerLayer.style.pointerEvents = 'auto';
            }
        }

        function toggleStickerDrawer() {
            const drawer = document.getElementById('stickerDrawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                setTool('sticker');
            } else {
                setTool('pen');
            }
        }

        function setBrushSize(size) {
            brushSize = size;
            ['sizeSmall', 'sizeMedium', 'sizeLarge'].forEach(id => {
                document.getElementById(id).classList.remove('bg-amber-200', 'ring-2', 'ring-amber-500');
            });
            const activeId = size === 5 ? 'sizeSmall' : size === 12 ? 'sizeMedium' : 'sizeLarge';
            document.getElementById(activeId).classList.add('bg-amber-200', 'ring-2', 'ring-amber-500');
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function setupCanvasEvents() {
            const start = (e) => {
                if (currentTool === 'sticker') return;
                isDrawing = true;
                const pos = getPointerPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const move = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPointerPos(e);
                ctx.lineWidth = brushSize;
                if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor;
                }
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const end = () => {
                if (!isDrawing) return;
                isDrawing = false;
                ctx.closePath();
                saveCurrentDrawing();
                renderSceneList();
            };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', end);
        }

        function clearCurrentCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            scenes[currentSceneIndex].drawingDataUrl = null;
            scenes[currentSceneIndex].stickers = [];
            renderStickers();
            renderSceneList();
        }

        function saveCurrentDrawing() {
            scenes[currentSceneIndex].drawingDataUrl = canvas.toDataURL('image/png');
        }

        // --- Sticker Management ---
        function addStickerToScene(emoji) {
            const newSticker = {
                id: 'stk_' + Date.now() + Math.random(),
                emoji: emoji,
                x: 50, // percentage
                y: 50, // percentage
                scale: 1
            };
            scenes[currentSceneIndex].stickers.push(newSticker);
            selectedStickerId = newSticker.id;
            renderStickers();
            renderSceneList();
        }

        function renderStickers() {
            stickerLayer.innerHTML = '';
            const currentStickers = scenes[currentSceneIndex].stickers;
            
            currentStickers.forEach(stk => {
                const el = document.createElement('div');
                el.className = `sticker-item text-5xl md:text-6xl select-none ${stk.id === selectedStickerId ? 'selected' : ''}`;
                el.textContent = stk.emoji;
                el.style.left = stk.x + '%';
                el.style.top = stk.y + '%';
                el.style.transform = `translate(-50%, -50%) scale(${stk.scale})`;

                // Dragging logic
                let dragging = false;
                const onDown = (e) => {
                    e.stopPropagation();
                    selectedStickerId = stk.id;
                    dragging = true;
                    updateSelectedStickerUI();
                    renderStickers();
                };

                const onMove = (e) => {
                    if (!dragging) return;
                    const rect = stickerLayer.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    let nx = ((clientX - rect.left) / rect.width) * 100;
                    let ny = ((clientY - rect.top) / rect.height) * 100;
                    nx = Math.max(5, Math.min(95, nx));
                    ny = Math.max(5, Math.min(95, ny));
                    stk.x = nx;
                    stk.y = ny;
                    el.style.left = nx + '%';
                    el.style.top = ny + '%';
                };

                const onUp = () => {
                    if (dragging) {
                        dragging = false;
                        renderSceneList();
                    }
                };

                el.addEventListener('mousedown', onDown);
                el.addEventListener('touchstart', onDown, { passive: true });
                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: true });
                window.addEventListener('mouseup', onUp);
                window.addEventListener('touchend', onUp);

                stickerLayer.appendChild(el);
            });
            updateSelectedStickerUI();
        }

        function updateSelectedStickerUI() {
            const ctrl = document.getElementById('selectedStickerControls');
            if (selectedStickerId) {
                ctrl.classList.remove('hidden');
            } else {
                ctrl.classList.add('hidden');
            }
        }

        function deselectSticker() {
            selectedStickerId = null;
            renderStickers();
        }

        function scaleSelectedSticker(factor) {
            if (!selectedStickerId) return;
            const stk = scenes[currentSceneIndex].stickers.find(s => s.id === selectedStickerId);
            if (stk) {
                stk.scale = Math.max(0.5, Math.min(3.0, stk.scale * factor));
                renderStickers();
                renderSceneList();
            }
        }

        function deleteSelectedSticker() {
            if (!selectedStickerId) return;
            scenes[currentSceneIndex].stickers = scenes[currentSceneIndex].stickers.filter(s => s.id !== selectedStickerId);
            selectedStickerId = null;
            renderStickers();
            renderSceneList();
        }

        // --- Scene Switching & Management ---
        function loadScene(index) {
            currentSceneIndex = index;
            selectedStickerId = null;
            const scene = scenes[index];

            document.getElementById('currentSceneBadge').textContent = `${index + 1}번째 장면`;
            document.getElementById('sceneText').value = scene.text;

            // Load canvas drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (scene.drawingDataUrl) {
                const img = new Image();
                img.onload = () => {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = scene.drawingDataUrl;
            }

            renderStickers();
            updateAudioButtons();
            renderSceneList();
        }

        function updateSceneText(val) {
            scenes[currentSceneIndex].text = val;
            renderSceneList();
        }

        function addScene() {
            saveCurrentDrawing();
            scenes.push(createEmptyScene(''));
            loadScene(scenes.length - 1);
        }

        function deleteScene(index, e) {
            e.stopPropagation();
            if (scenes.length <= 1) {
                alert('최소 1개의 장면은 있어야 해요!');
                return;
            }
            scenes.splice(index, 1);
            const nextIdx = Math.min(currentSceneIndex, scenes.length - 1);
            loadScene(nextIdx);
        }

        function moveScene(index, dir, e) {
            e.stopPropagation();
            const target = index + dir;
            if (target < 0 || target >= scenes.length) return;
            saveCurrentDrawing();
            const temp = scenes[index];
            scenes[index] = scenes[target];
            scenes[target] = temp;
            loadScene(target);
        }

        // Generate composite thumbnail image (drawing + stickers)
        function generateCompositeImage(scene, callback) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 800;
            offCanvas.height = 600;
            const oCtx = offCanvas.getContext('2d');

            oCtx.fillStyle = '#FFFFFF';
            oCtx.fillRect(0, 0, 800, 600);

            const drawStickersAndFinish = () => {
                scene.stickers.forEach(stk => {
                    oCtx.save();
                    const px = (stk.x / 100) * 800;
                    const py = (stk.y / 100) * 600;
                    oCtx.translate(px, py);
                    oCtx.scale(stk.scale, stk.scale);
                    oCtx.font = '84px sans-serif';
                    oCtx.textAlign = 'center';
                    oCtx.textBaseline = 'middle';
                    oCtx.fillText(stk.emoji, 0, 0);
                    oCtx.restore();
                });
                callback(offCanvas.toDataURL('image/png'));
            };

            if (scene.drawingDataUrl) {
                const img = new Image();
                img.onload = () => {
                    oCtx.drawImage(img, 0, 0, 800, 600);
                    drawStickersAndFinish();
                };
                img.src = scene.drawingDataUrl;
            } else {
                drawStickersAndFinish();
            }
        }

        function renderSceneList() {
            const list = document.getElementById('sceneList');
            list.innerHTML = '';

            scenes.forEach((scene, idx) => {
                const isActive = idx === currentSceneIndex;
                const card = document.createElement('div');
                card.onclick = () => {
                    playPop();
                    saveCurrentDrawing();
                    loadScene(idx);
                };
                card.className = `flex-shrink-0 w-44 lg:w-full p-2.5 rounded-2xl border-3 cursor-pointer transition-all flex flex-col gap-2 ${isActive ? 'bg-amber-100 border-orange-500 shadow-md' : 'bg-amber-50/60 border-amber-200 hover:bg-amber-100/50'}`;

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-jua text-base px-2.5 py-0.5 rounded-full ${isActive ? 'bg-orange-500 text-white' : 'bg-amber-300 text-amber-950'}">${idx + 1}컷</span>
                        <div class="flex items-center gap-1">
                            <button onclick="moveScene(${idx}, -1, event)" class="p-1 hover:bg-white rounded-lg text-xs" title="앞으로">⬆️</button>
                            <button onclick="moveScene(${idx}, 1, event)" class="p-1 hover:bg-white rounded-lg text-xs" title="뒤로">⬇️</button>
                            <button onclick="deleteScene(${idx}, event)" class="p-1 hover:bg-rose-100 text-rose-600 rounded-lg text-xs" title="삭제">❌</button>
                        </div>
                    </div>
                    <div class="w-full aspect-[4/3] bg-white rounded-xl border border-amber-200 overflow-hidden relative">
                        <img id="thumb_${scene.id}" class="w-full h-full object-contain" />
                        ${scene.audioUrl ? '<span class="absolute bottom-1 right-1 bg-sky-500 text-white text-xs px-1.5 py-0.5 rounded-full">🎤</span>' : ''}
                    </div>
                    <p class="text-xs text-amber-900 truncate font-bold">${scene.text || '(이야기 없음)'}</p>
                `;
                list.appendChild(card);

                generateCompositeImage(scene, (dataUrl) => {
                    const imgEl = document.getElementById(`thumb_${scene.id}`);
                    if (imgEl) imgEl.src = dataUrl;
                });
            });
        }

        // --- Voice Recording (MediaRecorder) ---
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentAudioPlayer = null;

        async function toggleRecording() {
            playPop();
            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                updateRecordBtnUI(false);
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    scenes[currentSceneIndex].audioUrl = url;
                    updateAudioButtons();
                    renderSceneList();
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                updateRecordBtnUI(true);
            } catch (err) {
                alert('마이크를 사용할 수 없어요! 브라우저의 마이크 권한을 허용해 주세요.');
            }
        }

        function updateRecordBtnUI(recording) {
            const btn = document.getElementById('recordBtn');
            const label = document.getElementById('recordLabel');
            const icon = document.getElementById('recordIcon');
            if (recording) {
                btn.classList.add('recording-pulse', 'bg-red-600');
                icon.textContent = '⏹️';
                label.textContent = '멈추기';
            } else {
                btn.classList.remove('recording-pulse', 'bg-red-600');
                icon.textContent = '🎙️';
                label.textContent = '녹음하기';
            }
        }

        function updateAudioButtons() {
            const playBtn = document.getElementById('playAudioBtn');
            playBtn.disabled = !scenes[currentSceneIndex].audioUrl;
        }

        function playRecordedAudio() {
            const url = scenes[currentSceneIndex].audioUrl;
            if (!url) return;
            if (currentAudioPlayer) currentAudioPlayer.pause();
            currentAudioPlayer = new Audio(url);
            currentAudioPlayer.play();
        }

        // --- Storybook Presentation Modal ---
        let modalSceneIndex = 0;

        function openStorybookModal() {
            saveCurrentDrawing();
            modalSceneIndex = 0;
            document.getElementById('storybookModal').classList.remove('hidden');
            renderModalScene();
        }

        function closeStorybookModal() {
            document.getElementById('storybookModal').classList.add('hidden');
            if (currentAudioPlayer) currentAudioPlayer.pause();
            window.speechSynthesis.cancel();
        }

        function renderModalScene() {
            const scene = scenes[modalSceneIndex];
            document.getElementById('modalPageBadge').textContent = `${modalSceneIndex + 1} / ${scenes.length}`;
            document.getElementById('modalSceneText').textContent = scene.text || '그림을 감상해 보세요!';

            generateCompositeImage(scene, (dataUrl) => {
                document.getElementById('modalSceneImg').src = dataUrl;
            });

            document.getElementById('modalPrevBtn').disabled = modalSceneIndex === 0;
            document.getElementById('modalNextBtn').disabled = modalSceneIndex === scenes.length - 1;

            const listenLabel = document.getElementById('modalListenLabel');
            listenLabel.textContent = scene.audioUrl ? '내 목소리로 듣기' : '책 읽어주기';
        }

        function prevModalScene() {
            if (modalSceneIndex > 0) {
                modalSceneIndex--;
                renderModalScene();
            }
        }

        function nextModalScene() {
            if (modalSceneIndex < scenes.length - 1) {
                modalSceneIndex++;
                renderModalScene();
            }
        }

        function playModalVoiceOrTTS() {
            const scene = scenes[modalSceneIndex];
            if (currentAudioPlayer) currentAudioPlayer.pause();
            window.speechSynthesis.cancel();

            if (scene.audioUrl) {
                currentAudioPlayer = new Audio(scene.audioUrl);
                currentAudioPlayer.play();
            } else if (scene.text) {
                const utterance = new SpeechSynthesisUtterance(scene.text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.95;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- PDF Export Function (Renders crisp Korean text & artwork per page) ---
        async function exportToPDF() {
            saveCurrentDrawing();
            if (!window.jspdf) {
                alert('PDF 생성 도구를 불러오는 중입니다. 잠시 후 다시 눌러주세요.');
                return;
            }

            const { jsPDF } = window.jspdf;
            // Landscape A4 storybook layout
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });

            const pageWidth = doc.internal.pageSize.getWidth();   // 297mm
            const pageHeight = doc.internal.pageSize.getHeight(); // 210mm

            for (let i = 0; i < scenes.length; i++) {
                if (i > 0) doc.addPage();

                const scene = scenes[i];
                const compositeDataUrl = await new Promise((resolve) => {
                    generateCompositeImage(scene, resolve);
                });

                // Render full storybook page onto a high-res canvas so Korean fonts render cleanly
                const pageCanvas = document.createElement('canvas');
                pageCanvas.width = 1600;
                pageCanvas.height = 1131; // A4 landscape ratio
                const pCtx = pageCanvas.getContext('2d');

                // Warm cream background
                pCtx.fillStyle = '#FFFBEB';
                pCtx.fillRect(0, 0, 1600, 1131);

                // Outer decorative border
                pCtx.strokeStyle = '#F59E0B';
                pCtx.lineWidth = 14;
                pCtx.strokeRect(36, 36, 1528, 1059);

                // Page header badge
                pCtx.fillStyle = '#F97316';
                pCtx.beginPath();
                pCtx.roundRect(70, 65, 220, 56, 28);
                pCtx.fill();

                pCtx.fillStyle = '#FFFFFF';
                pCtx.font = 'bold 30px "Jua", "Malgun Gothic", sans-serif';
                pCtx.textAlign = 'center';
                pCtx.textBaseline = 'middle';
                pCtx.fillText(`${i + 1}번째 장면`, 180, 93);

                // Page number on top right
                pCtx.fillStyle = '#92400E';
                pCtx.font = 'bold 28px "Jua", "Malgun Gothic", sans-serif';
                pCtx.textAlign = 'right';
                pCtx.fillText(`${i + 1} / ${scenes.length}`, 1520, 93);

                // Artwork container box
                const imgX = 320;
                const imgY = 140;
                const imgW = 960;
                const imgH = 720;

                pCtx.fillStyle = '#FFFFFF';
                pCtx.fillRect(imgX, imgY, imgW, imgH);
                pCtx.strokeStyle = '#FCD34D';
                pCtx.lineWidth = 6;
                pCtx.strokeRect(imgX, imgY, imgW, imgH);

                // Draw scene composite image
                await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        pCtx.drawImage(img, imgX, imgY, imgW, imgH);
                        resolve();
                    };
                    img.src = compositeDataUrl;
                });

                // Story text box at bottom
                pCtx.fillStyle = '#FFFFFF';
                pCtx.beginPath();
                pCtx.roundRect(140, 890, 1320, 165, 24);
                pCtx.fill();
                pCtx.strokeStyle = '#FDBA74';
                pCtx.lineWidth = 4;
                pCtx.stroke();

                // Wrap & draw Korean story text
                pCtx.fillStyle = '#451A03';
                pCtx.font = 'bold 36px "Gowun Dodum", "Malgun Gothic", sans-serif';
                pCtx.textAlign = 'center';
                pCtx.textBaseline = 'middle';

                const textContent = scene.text ? scene.text.trim() : '(이야기 내용이 비어 있어요)';
                const lines = wrapTextLines(pCtx, textContent, 1220);
                const lineHeight = 48;
                const startY = 972 - ((lines.length - 1) * lineHeight) / 2;

                lines.slice(0, 3).forEach((line, idx) => {
                    pCtx.fillText(line, 800, startY + idx * lineHeight);
                });

                const pageImgData = pageCanvas.toDataURL('image/jpeg', 0.92);
                doc.addImage(pageImgData, 'JPEG', 0, 0, pageWidth, pageHeight);
            }

            doc.save('꼬마작가의_동화책.pdf');
        }

        function wrapTextLines(context, text, maxWidth) {
            const rawLines = text.split('\n');
            const wrapped = [];
            rawLines.forEach(rawLine => {
                let currentLine = '';
                for (let i = 0; i < rawLine.length; i++) {
                    const testLine = currentLine + rawLine[i];
                    if (context.measureText(testLine).width > maxWidth && currentLine.length > 0) {
                        wrapped.push(currentLine);
                        currentLine = rawLine[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) wrapped.push(currentLine);
            });
            return wrapped.length > 0 ? wrapped : [''];
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
