<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>내 마음대로 뚝딱! 스토리보드</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트: Jua (주아체 - 둥글둥글하고 귀여운 한글 폰트) & Gowun Dodum -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <!-- Tone.js (귀여운 효과음 생성용, 외부 오디오 파일 불필요) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #FFFDF7; /* 따뜻한 크림색 배경 */
            color: #4A4A4A;
            user-select: none; /* 터치 시 텍스트 선택 방지 */
            -webkit-tap-highlight-color: transparent;
        }
        .font-story {
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: 700;
        }
        /* 버튼 젤리 효과 애니메이션 */
        .jelly-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .jelly-btn:active {
            transform: scale(0.92);
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF3D6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFCA64;
            border-radius: 10px;
        }
        /* 캔버스 컨테이너 비율 유지 */
        .canvas-wrapper {
            aspect-ratio: 4 / 3;
            touch-action: none; /* 캔버스 위에서 브라우저 스크롤 방지 */
        }
        /* 녹음 중 펄스 애니메이션 */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 상단 헤더 영역 -->
    <header class="bg-[#FFE599] border-b-4 border-[#FFD15C] px-4 py-3 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- 타이틀 & 아이콘 -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-3xl shadow-sm border-2 border-[#FFD15C]">
                    🎨
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl text-[#5C4300] tracking-wide">뚝딱뚝딱 이야기 그림책</h1>
                    <p class="text-xs sm:text-sm text-[#8C6D1F] font-story">그림을 그리고 목소리를 녹음해 나만의 이야기를 만들어요!</p>
                </div>
            </div>

            <!-- 상단 액션 버튼 -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="addScene()" class="jelly-btn bg-white hover:bg-[#FFF9E6] text-[#5C4300] border-2 border-[#FFD15C] px-4 py-2.5 rounded-2xl text-lg flex items-center gap-1.5 shadow-sm">
                    <span>➕</span>
                    <span>장면 추가</span>
                </button>
                <button onclick="openPresentation()" class="jelly-btn bg-[#FF7B7B] hover:bg-[#FF6363] text-white border-b-4 border-[#D95353] px-5 py-2.5 rounded-2xl text-lg sm:text-xl flex items-center gap-2 shadow-md">
                    <span>📖</span>
                    <span>동화책 보기</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 작업 공간 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- 왼쪽: 선택된 장면(컷) 상세 편집기 -->
        <section class="flex-1 bg-white rounded-3xl border-4 border-[#BCE3FA] p-4 sm:p-6 shadow-md flex flex-col gap-4">
            <!-- 현재 장면 표시 및 제목 -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="current-scene-badge" class="bg-[#4FB0E8] text-white px-4 py-1.5 rounded-full text-xl shadow-sm">1번째 장면</span>
                    <span class="text-gray-400 text-sm sm:text-base font-story">그림을 그리고 스티커를 붙여보세요!</span>
                </div>
                <button onclick="confirmClearCanvas()" class="jelly-btn bg-[#F3F4F6] hover:bg-[#E5E7EB] text-gray-600 px-3.5 py-2 rounded-xl text-base flex items-center gap-1">
                    <span>🗑️</span>
                    <span>모두 지우기</span>
                </button>
            </div>

            <!-- 도구 모음 (펜 색상, 굵기, 지우개, 스티커 탭) -->
            <div class="bg-[#F0F9FF] p-3 rounded-2xl border-2 border-[#D2ECFC] flex flex-col gap-3">
                <!-- 상단 도구 선택: 그리기 vs 스티커 -->
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <button id="btn-mode-draw" onclick="setToolMode('draw')" class="jelly-btn bg-[#4FB0E8] text-white px-4 py-2 rounded-xl text-lg flex items-center gap-1.5 shadow-sm">
                            <span>🖍️</span>
                            <span>크레파스</span>
                        </button>
                        <button id="btn-mode-eraser" onclick="setToolMode('eraser')" class="jelly-btn bg-white text-gray-600 border-2 border-gray-200 px-4 py-2 rounded-xl text-lg flex items-center gap-1.5">
                            <span>🧼</span>
                            <span>지우개</span>
                        </button>
                        <button id="btn-mode-sticker" onclick="setToolMode('sticker')" class="jelly-btn bg-white text-gray-600 border-2 border-gray-200 px-4 py-2 rounded-xl text-lg flex items-center gap-1.5">
                            <span>⭐</span>
                            <span>스티커 붙이기</span>
                        </button>
                    </div>

                    <!-- 펜 굵기 조절 (그리기/지우개 모드일 때 표시) -->
                    <div id="brush-size-controls" class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-[#D2ECFC]">
                        <span class="text-sm text-gray-500">굵기:</span>
                        <button onclick="setBrushSize(4)" class="brush-size-btn w-8 h-8 rounded-full flex items-center justify-center hover:bg-blue-50" data-size="4">
                            <span class="w-2 h-2 rounded-full bg-gray-700"></span>
                        </button>
                        <button onclick="setBrushSize(10)" class="brush-size-btn w-8 h-8 rounded-full flex items-center justify-center bg-blue-100 ring-2 ring-[#4FB0E8]" data-size="10">
                            <span class="w-3.5 h-3.5 rounded-full bg-gray-700"></span>
                        </button>
                        <button onclick="setBrushSize(20)" class="brush-size-btn w-8 h-8 rounded-full flex items-center justify-center hover:bg-blue-50" data-size="20">
                            <span class="w-5 h-5 rounded-full bg-gray-700"></span>
                        </button>
                    </div>
                </div>

                <!-- 크레파스 색상 팔레트 -->
                <div id="color-palette" class="flex flex-wrap items-center gap-2 pt-1">
                    <!-- JS로 10가지 크레파스 색상 버튼 생성 -->
                </div>

                <!-- 스티커 선택 패널 (스티커 모드일 때 표시) -->
                <div id="sticker-panel" class="hidden flex-col gap-2 pt-1">
                    <div class="flex items-center justify-between text-sm text-[#2B6CB0]">
                        <span>원하는 스티커를 고른 뒤, 아래 도화지를 콕! 누르거나 드래그하세요.</span>
                        <div class="flex items-center gap-1">
                            <span>스티커 크기:</span>
                            <button onclick="changeStickerScale(-0.2)" class="bg-white border border-blue-200 px-2 py-0.5 rounded-lg font-bold">-</button>
                            <span id="sticker-size-label" class="px-1 font-bold">보통</span>
                            <button onclick="changeStickerScale(0.2)" class="bg-white border border-blue-200 px-2 py-0.5 rounded-lg font-bold">+</button>
                        </div>
                    </div>
                    <div id="sticker-list" class="flex flex-wrap gap-2 max-h-28 overflow-y-auto p-1 bg-white rounded-xl border border-[#D2ECFC]">
                        <!-- JS로 귀여운 이모지 스티커 버튼 생성 -->
                    </div>
                </div>
            </div>

            <!-- HTML5 캔버스 도화지 영역 -->
            <div class="relative w-full canvas-wrapper bg-white rounded-2xl border-4 border-dashed border-[#CBD5E1] overflow-hidden shadow-inner">
                <canvas id="drawing-canvas" class="w-full h-full block cursor-crosshair"></canvas>
                <!-- 스티커 배치 시 선택된 스티커 삭제 안내 플로팅 버튼 -->
                <div id="sticker-helper" class="hidden absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-xl border-2 border-[#FFD15C] shadow-md flex items-center gap-2 text-sm">
                    <span>선택된 스티커: <strong id="selected-sticker-preview" class="text-xl">🐶</strong></span>
                    <button onclick="deleteSelectedSticker()" class="bg-red-100 text-red-600 px-2 py-1 rounded-lg hover:bg-red-200">지우기</button>
                </div>
            </div>

            <!-- 이야기 입력 및 음성 녹음 영역 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-1">
                <!-- 텍스트 입력 -->
                <div class="md:col-span-2 flex flex-col gap-1.5">
                    <label for="story-text" class="text-lg text-[#3B7A9E] flex items-center gap-1.5">
                        <span>✏️</span>
                        <span>이 장면의 이야기를 적어주세요</span>
                    </label>
                    <textarea id="story-text" rows="2" oninput="updateSceneText(this.value)" placeholder="예: 맑은 날, 강아지 몽이가 공원으로 산책을 나갔어요!" class="font-story w-full p-3.5 text-lg sm:text-xl rounded-2xl border-2 border-[#BCE3FA] focus:border-[#4FB0E8] focus:outline-none bg-[#F8FCFF] resize-none"></textarea>
                </div>

                <!-- 음성 녹음 컨트롤 -->
                <div class="flex flex-col gap-1.5 justify-between bg-[#FFF5F5] p-3.5 rounded-2xl border-2 border-[#FED7D7]">
                    <span class="text-lg text-[#C53030] flex items-center gap-1.5">
                        <span>🎤</span>
                        <span>내 목소리 녹음</span>
                    </span>
                    
                    <div class="flex items-center gap-2 my-auto">
                        <button id="btn-record" onclick="toggleRecording()" class="jelly-btn flex-1 bg-[#FF6B6B] hover:bg-[#FA5252] text-white py-2.5 px-3 rounded-xl text-base sm:text-lg flex items-center justify-center gap-1.5 shadow-sm">
                            <span id="record-icon">🔴</span>
                            <span id="record-label">녹음하기</span>
                        </button>
                        <button id="btn-play-audio" onclick="playSceneAudio()" disabled class="jelly-btn bg-white disabled:opacity-40 text-[#C53030] border-2 border-[#FEB2B2] py-2.5 px-3 rounded-xl text-base sm:text-lg flex items-center justify-center gap-1">
                            <span>▶️</span>
                            <span>듣기</span>
                        </button>
                    </div>
                    <p id="audio-status" class="text-xs text-center text-gray-500 font-story">버튼을 눌러 목소리를 들려주세요!</p>
                </div>
            </div>
        </section>

        <!-- 오른쪽(모바일에서는 하단): 전체 스토리보드 컷 목록 (4컷 만화 흐름) -->
        <aside class="w-full lg:w-80 xl:w-96 flex flex-col gap-3">
            <div class="bg-[#E6F7ED] border-4 border-[#B7E4C7] rounded-3xl p-4 shadow-md flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl text-[#2D6A4F] flex items-center gap-2">
                        <span>🎞️</span>
                        <span>전체 이야기 순서</span>
                    </h2>
                    <span id="total-scenes-count" class="bg-[#52B788] text-white text-sm px-3 py-1 rounded-full">총 4장면</span>
                </div>
                <p class="text-xs text-[#40916C] font-story">장면을 누르면 그림을 고칠 수 있고, 화살표로 순서를 바꿀 수 있어요.</p>

                <!-- 컷 썸네일 리스트 -->
                <div id="storyboard-list" class="flex lg:flex-col gap-3 overflow-x-auto lg:overflow-y-auto lg:max-h-[650px] pb-2 lg:pb-0 pr-1">
                    <!-- JS로 각 장면 카드 렌더링 -->
                </div>
            </div>
        </aside>
    </main>

    <!-- 동화책 보기 (발표 모드) 전체화면 모달 -->
    <div id="presentation-modal" class="fixed inset-0 bg-[#2C3E50]/95 z-50 hidden flex-col items-center justify-between p-4 sm:p-8">
        <!-- 상단 닫기 및 진행률 -->
        <div class="w-full max-w-5xl flex items-center justify-between text-white">
            <div class="flex items-center gap-3">
                <span class="text-3xl">📖</span>
                <span id="pres-page-indicator" class="text-2xl bg-white/20 px-4 py-1.5 rounded-full">1 / 4</span>
            </div>
            <button onclick="closePresentation()" class="jelly-btn bg-[#FF6B6B] hover:bg-[#FA5252] text-white px-5 py-2.5 rounded-2xl text-xl flex items-center gap-2 shadow-lg">
                <span>✖️</span>
                <span>그만 보기</span>
            </button>
        </div>

        <!-- 중앙 동화책 페이지 카드 -->
        <div class="w-full max-w-4xl bg-[#FFFDF7] rounded-3xl border-8 border-[#FFE599] p-4 sm:p-8 shadow-2xl flex flex-col items-center gap-5 my-auto">
            <!-- 그림 표시 영역 -->
            <div class="w-full max-w-2xl aspect-[4/3] bg-white rounded-2xl border-4 border-[#BCE3FA] overflow-hidden shadow-inner flex items-center justify-center">
                <img id="pres-image" src="" alt="장면 그림" class="w-full h-full object-contain">
            </div>

            <!-- 이야기 자막 영역 -->
            <div class="w-full bg-[#FFF9E6] border-2 border-[#FFD15C] rounded-2xl p-4 sm:p-6 text-center min-h-[100px] flex items-center justify-center">
                <p id="pres-text" class="font-story text-2xl sm:text-3xl text-[#4A4A4A] leading-relaxed break-keep">
                    여기에 이야기가 나옵니다.
                </p>
            </div>

            <!-- 소리 듣기 버튼 (녹음 음성 & AI 읽어주기) -->
            <div class="flex flex-wrap items-center justify-center gap-3">
                <button id="pres-btn-voice" onclick="playPresentationVoice()" class="jelly-btn bg-[#FF7B7B] hover:bg-[#FF6363] text-white px-6 py-3 rounded-2xl text-xl flex items-center gap-2 shadow-md">
                    <span>🎤</span>
                    <span>녹음한 목소리 듣기</span>
                </button>
                <button onclick="speakPresentationTTS()" class="jelly-btn bg-[#4FB0E8] hover:bg-[#3A9AD3] text-white px-6 py-3 rounded-2xl text-xl flex items-center gap-2 shadow-md">
                    <span>🔊</span>
                    <span>동화책 읽어주기</span>
                </button>
            </div>
        </div>

        <!-- 하단 이전/다음 책장 넘기기 버튼 -->
        <div class="w-full max-w-4xl flex items-center justify-between gap-4">
            <button id="pres-prev-btn" onclick="changePresentationPage(-1)" class="jelly-btn bg-white disabled:opacity-30 text-[#4A4A4A] px-6 py-3.5 rounded-2xl text-xl sm:text-2xl flex items-center gap-2 shadow-lg">
                <span>⬅️</span>
                <span>이전 장면</span>
            </button>
            <button id="pres-next-btn" onclick="changePresentationPage(1)" class="jelly-btn bg-[#FFD15C] disabled:opacity-30 text-[#5C4300] px-6 py-3.5 rounded-2xl text-xl sm:text-2xl flex items-center gap-2 shadow-lg">
                <span>다음 장면</span>
                <span>➡️</span>
            </button>
        </div>
    </div>

    <!-- 커스텀 알림/확인 모달 (alert, confirm 대체) -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl border-4 border-[#FFE599] max-w-md w-full p-6 text-center shadow-2xl flex flex-col gap-4 transform transition-all">
            <div id="dialog-icon" class="text-5xl mx-auto">💡</div>
            <h3 id="dialog-title" class="text-2xl text-[#5C4300]">알림</h3>
            <p id="dialog-message" class="font-story text-lg text-gray-600 break-keep">메시지 내용</p>
            <div id="dialog-buttons" class="flex items-center justify-center gap-3 pt-2">
                <!-- JS로 버튼 생성 -->
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. 상태 관리 및 초기 데이터 설정
           ========================================================================== */
        
        // 10가지 크레파스 색상 팔레트 (저학년이 좋아하는 선명하고 따뜻한 색감)
        const CRAYON_COLORS = [
            { name: '검정', hex: '#2D3748' },
            { name: '빨강', hex: '#F56565' },
            { name: '주황', hex: '#ED8936' },
            { name: '노랑', hex: '#ECC94B' },
            { name: '연두', hex: '#48BB78' },
            { name: '초록', hex: '#2F855A' },
            { name: '하늘', hex: '#4299E1' },
            { name: '파랑', hex: '#3182CE' },
            { name: '보라', hex: '#9F7AEA' },
            { name: '갈색', hex: '#8B5A2B' }
        ];

        // 귀여운 이모지 스티커 목록
        const STICKER_EMOJIS = [
            '🐶', '🐱', '🐰', '🐻', '🦊', '🦁', '🐸', '🐧', '🐤', '🦋',
            '☀️', '🌤️', '☁️', '🌈', '⭐', '🌙', '🌸', '🌻', '🌳', '🍎',
            '🏠', '🏫', '🚗', '🚌', '🚀', '🎈', '🎁', '👑', '❤️', '✨',
            '😄', '😆', '😍', '😮', '😢', '😡'
        ];

        // 스토리보드 장면 데이터 배열 (기본 4컷 제공)
        let scenes = [
            createEmptyScene(1, '옛날 옛적에 귀여운 친구가 살았어요.'),
            createEmptyScene(2, ''),
            createEmptyScene(3, ''),
            createEmptyScene(4, '')
        ];

        let currentSceneIndex = 0; // 현재 편집 중인 장면 인덱스
        let presentationIndex = 0; // 발표 모드 현재 페이지

        // 그리기 도구 상태
        let toolMode = 'draw'; // 'draw' | 'eraser' | 'sticker'
        let currentColor = CRAYON_COLORS[0].hex;
        let brushSize = 10;
        let selectedStickerEmoji = STICKER_EMOJIS[0];
        let stickerScale = 1.0; // 기본 크기 배율 (1.0 = 64px)

        // 캔버스 및 레이어 관리 (자유 드로잉 레이어와 스티커 객체를 분리하여 스티커 이동/삭제 지원)
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        
        // 자유 드로잉만 별도로 저장하는 오프스크린 캔버스
        const drawLayer = document.createElement('canvas');
        const drawCtx = drawLayer.getContext('2d');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // 스티커 드래그 상태
        let activeStickerIndex = -1;
        let isDraggingSticker = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // 음성 녹음 관련 상태 (MediaRecorder API)
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentAudioPlayer = null;

        // 빈 장면 객체 생성 도우미
        function createEmptyScene(num, defaultText = '') {
            return {
                id: Date.now() + Math.random(),
                drawingDataUrl: null, // 오프스크린 드로잉 레이어 이미지 데이터
                stickers: [], // { emoji, x, y, size } 배열 (비율 좌표 0~1 사용)
                thumbnailUrl: null, // 합쳐진 최종 썸네일 이미지
                text: defaultText,
                audioUrl: null // 녹음된 오디오 Blob URL
            };
        }

        /* ==========================================================================
           2. 효과음 (Tone.js) - 아이들에게 즐거운 청각 피드백 제공
           ========================================================================== */
        let synth = null;
        function playPopSound(freq = 'C5') {
            try {
                if (typeof Tone !== 'undefined') {
                    if (Tone.context.state !== 'running') {
                        Tone.start();
                    }
                    if (!synth) {
                        synth = new Tone.Synth({
                            oscillator: { type: 'sine' },
                            envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
                        }).toDestination();
                        synth.volume.value = -10;
                    }
                    synth.triggerAttackRelease(freq, '16n');
                }
            } catch (e) {
                // 오디오 컨텍스트 제한 시 무시
            }
        }

        /* ==========================================================================
           3. 초기화 및 UI 렌더링
           ========================================================================== */
        window.onload = function() {
            initColorPalette();
            initStickerList();
            resizeCanvas();
            loadSceneToEditor(0);
            renderStoryboardList();

            // 창 크기 변경 시 캔버스 해상도 대응
            window.addEventListener('resize', () => {
                saveCurrentSceneCanvas();
                resizeCanvas();
                loadSceneCanvas(currentSceneIndex);
            });
        };

        // 크레파스 색상 버튼 생성
        function initColorPalette() {
            const container = document.getElementById('color-palette');
            container.innerHTML = '';
            CRAYON_COLORS.forEach((color, idx) => {
                const btn = document.createElement('button');
                btn.className = `jelly-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full border-4 shadow-sm transition-transform ${idx === 0 ? 'border-gray-800 scale-110' : 'border-white'}`;
                btn.style.backgroundColor = color.hex;
                btn.title = color.name;
                btn.setAttribute('aria-label', color.name);
                btn.onclick = () => {
                    playPopSound('E5');
                    currentColor = color.hex;
                    setToolMode('draw');
                    // 선택 표시 업데이트
                    Array.from(container.children).forEach(b => {
                        b.classList.remove('border-gray-800', 'scale-110');
                        b.classList.add('border-white');
                    });
                    btn.classList.remove('border-white');
                    btn.classList.add('border-gray-800', 'scale-110');
                };
                container.appendChild(btn);
            });
        }

        // 스티커 목록 생성
        function initStickerList() {
            const container = document.getElementById('sticker-list');
            container.innerHTML = '';
            STICKER_EMOJIS.forEach((emoji, idx) => {
                const btn = document.createElement('button');
                btn.className = `jelly-btn text-2xl sm:text-3xl p-1.5 rounded-xl hover:bg-blue-50 ${idx === 0 ? 'bg-blue-100 ring-2 ring-[#4FB0E8]' : ''}`;
                btn.textContent = emoji;
                btn.onclick = () => {
                    playPopSound('G5');
                    selectedStickerEmoji = emoji;
                    Array.from(container.children).forEach(b => b.classList.remove('bg-blue-100', 'ring-2', 'ring-[#4FB0E8]'));
                    btn.classList.add('bg-blue-100', 'ring-2', 'ring-[#4FB0E8]');
                };
                container.appendChild(btn);
            });
        }

        // 캔버스 크기 맞추기 (내부 해상도 800x600 고정으로 기기 간 그림 비율 완벽 호환)
        function resizeCanvas() {
            canvas.width = 800;
            canvas.height = 600;
            drawLayer.width = 800;
            drawLayer.height = 600;
            
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        /* ==========================================================================
           4. 도구 모드 및 스티커 조작
           ========================================================================== */
        function setToolMode(mode) {
            toolMode = mode;
            playPopSound('C5');

            const btnDraw = document.getElementById('btn-mode-draw');
            const btnEraser = document.getElementById('btn-mode-eraser');
            const btnSticker = document.getElementById('btn-mode-sticker');
            const brushControls = document.getElementById('brush-size-controls');
            const colorPalette = document.getElementById('color-palette');
            const stickerPanel = document.getElementById('sticker-panel');

            // 모든 버튼 초기화
            [btnDraw, btnEraser, btnSticker].forEach(b => {
                b.className = 'jelly-btn bg-white text-gray-600 border-2 border-gray-200 px-4 py-2 rounded-xl text-lg flex items-center gap-1.5';
            });

            if (mode === 'draw') {
                btnDraw.className = 'jelly-btn bg-[#4FB0E8] text-white px-4 py-2 rounded-xl text-lg flex items-center gap-1.5 shadow-sm';
                brushControls.classList.remove('hidden');
                colorPalette.classList.remove('hidden');
                stickerPanel.classList.add('hidden');
                canvas.style.cursor = 'crosshair';
                activeStickerIndex = -1;
                updateStickerHelper();
                renderMainCanvas();
            } else if (mode === 'eraser') {
                btnEraser.className = 'jelly-btn bg-[#4FB0E8] text-white px-4 py-2 rounded-xl text-lg flex items-center gap-1.5 shadow-sm';
                brushControls.classList.remove('hidden');
                colorPalette.classList.add('hidden');
                stickerPanel.classList.add('hidden');
                canvas.style.cursor = 'cell';
                activeStickerIndex = -1;
                updateStickerHelper();
                renderMainCanvas();
            } else if (mode === 'sticker') {
                btnSticker.className = 'jelly-btn bg-[#FF9F43] text-white px-4 py-2 rounded-xl text-lg flex items-center gap-1.5 shadow-sm';
                brushControls.classList.add('hidden');
                colorPalette.classList.add('hidden');
                stickerPanel.classList.remove('hidden');
                stickerPanel.classList.add('flex');
                canvas.style.cursor = 'pointer';
            }
        }

        function setBrushSize(size) {
            brushSize = size;
            playPopSound('D5');
            document.querySelectorAll('.brush-size-btn').forEach(btn => {
                if (parseInt(btn.dataset.size) === size) {
                    btn.classList.add('bg-blue-100', 'ring-2', 'ring-[#4FB0E8]');
                } else {
                    btn.classList.remove('bg-blue-100', 'ring-2', 'ring-[#4FB0E8]');
                }
            });
        }

        function changeStickerScale(delta) {
            stickerScale = Math.min(2.2, Math.max(0.6, +(stickerScale + delta).toFixed(1)));
            const label = document.getElementById('sticker-size-label');
            if (stickerScale < 0.9) label.textContent = '작게';
            else if (stickerScale > 1.3) label.textContent = '크게';
            else label.textContent = '보통';

            // 현재 선택된 스티커가 있다면 즉시 크기 반영
            if (activeStickerIndex !== -1 && scenes[currentSceneIndex].stickers[activeStickerIndex]) {
                scenes[currentSceneIndex].stickers[activeStickerIndex].size = 75 * stickerScale;
                renderMainCanvas();
                saveCurrentSceneCanvas();
            }
            playPopSound('A5');
        }

        function updateStickerHelper() {
            const helper = document.getElementById('sticker-helper');
            const preview = document.getElementById('selected-sticker-preview');
            const stickers = scenes[currentSceneIndex].stickers;
            if (activeStickerIndex !== -1 && stickers[activeStickerIndex]) {
                helper.classList.remove('hidden');
                preview.textContent = stickers[activeStickerIndex].emoji;
            } else {
                helper.classList.add('hidden');
            }
        }

        function deleteSelectedSticker() {
            if (activeStickerIndex !== -1) {
                scenes[currentSceneIndex].stickers.splice(activeStickerIndex, 1);
                activeStickerIndex = -1;
                updateStickerHelper();
                renderMainCanvas();
                saveCurrentSceneCanvas();
                playPopSound('C4');
            }
        }

        /* ==========================================================================
           5. 캔버스 드로잉 및 스티커 터치/마우스 이벤트 처리
           ========================================================================== */
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handlePointerDown(e) {
            if (e.cancelable) e.preventDefault();
            const pos = getCanvasCoords(e);
            const currentStickers = scenes[currentSceneIndex].stickers;

            // 1. 먼저 기존 스티커를 클릭했는지 확인 (스티커 모드이거나 스티커 위를 직접 터치한 경우)
            let hitIndex = -1;
            for (let i = currentStickers.length - 1; i >= 0; i--) {
                const st = currentStickers[i];
                const halfSize = st.size * 0.6;
                if (Math.abs(pos.x - st.x) <= halfSize && Math.abs(pos.y - st.y) <= halfSize) {
                    hitIndex = i;
                    break;
                }
            }

            if (toolMode === 'sticker') {
                if (hitIndex !== -1) {
                    // 기존 스티커 선택 및 드래그 시작
                    activeStickerIndex = hitIndex;
                    isDraggingSticker = true;
                    dragOffsetX = pos.x - currentStickers[hitIndex].x;
                    dragOffsetY = pos.y - currentStickers[hitIndex].y;
                    updateStickerHelper();
                    renderMainCanvas();
                } else {
                    // 새 스티커 찍기!
                    const newSticker = {
                        emoji: selectedStickerEmoji,
                        x: pos.x,
                        y: pos.y,
                        size: 75 * stickerScale
                    };
                    currentStickers.push(newSticker);
                    activeStickerIndex = currentStickers.length - 1;
                    isDraggingSticker = true;
                    dragOffsetX = 0;
                    dragOffsetY = 0;
                    playPopSound('G5');
                    updateStickerHelper();
                    renderMainCanvas();
                    saveCurrentSceneCanvas();
                }
                return;
            }

            // 그리기 또는 지우개 모드
            activeStickerIndex = -1;
            updateStickerHelper();
            isDrawing = true;
            lastX = pos.x;
            lastY = pos.y;

            // 점 하나만 찍을 때도 그려지도록 처리
            drawStroke(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1);
            renderMainCanvas();
        }

        function handlePointerMove(e) {
            if (e.cancelable) e.preventDefault();
            const pos = getCanvasCoords(e);

            if (isDraggingSticker && activeStickerIndex !== -1) {
                const st = scenes[currentSceneIndex].stickers[activeStickerIndex];
                if (st) {
                    st.x = Math.max(20, Math.min(canvas.width - 20, pos.x - dragOffsetX));
                    st.y = Math.max(20, Math.min(canvas.height - 20, pos.y - dragOffsetY));
                    renderMainCanvas();
                }
                return;
            }

            if (!isDrawing) return;
            drawStroke(lastX, lastY, pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
            renderMainCanvas();
        }

        function handlePointerUp() {
            if (isDrawing || isDraggingSticker) {
                isDrawing = false;
                isDraggingSticker = false;
                saveCurrentSceneCanvas();
            }
        }

        function drawStroke(x1, y1, x2, y2) {
            drawCtx.save();
            drawCtx.beginPath();
            drawCtx.moveTo(x1, y1);
            drawCtx.lineTo(x2, y2);
            if (toolMode === 'eraser') {
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.lineWidth = brushSize * 2.5;
            } else {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = currentColor;
                drawCtx.lineWidth = brushSize;
            }
            drawCtx.stroke();
            drawCtx.restore();
        }

        // 메인 화면 캔버스 합성 렌더링 (흰 배경 + 드로잉 레이어 + 스티커들)
        function renderMainCanvas(showSelectionBox = true) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 자유 드로잉 레이어 그리기
            ctx.drawImage(drawLayer, 0, 0);

            // 2. 스티커 그리기
            const stickers = scenes[currentSceneIndex].stickers;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            stickers.forEach((st, idx) => {
                ctx.font = `${st.size}px sans-serif`;
                ctx.fillText(st.emoji, st.x, st.y);

                // 선택된 스티커 테두리 표시
                if (showSelectionBox && idx === activeStickerIndex) {
                    ctx.save();
                    ctx.strokeStyle = '#FF9F43';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 4]);
                    const boxSize = st.size * 1.1;
                    ctx.strokeRect(st.x - boxSize / 2, st.y - boxSize / 2, boxSize, boxSize);
                    ctx.restore();
                }
            });
        }

        // 마우스 & 터치 이벤트 바인딩
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        // 현재 캔버스 상태를 장면 데이터에 저장하고 썸네일 갱신
        function saveCurrentSceneCanvas() {
            const scene = scenes[currentSceneIndex];
            scene.drawingDataUrl = drawLayer.toDataURL('image/png');
            
            // 선택 테두리 없이 깨끗한 썸네일 캡처
            renderMainCanvas(false);
            scene.thumbnailUrl = canvas.toDataURL('image/jpeg', 0.8);
            renderMainCanvas(true);

            updateThumbnailUI(currentSceneIndex);
        }

        // 저장된 장면 데이터를 캔버스에 불러오기
        function loadSceneCanvas(index) {
            const scene = scenes[index];
            drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);

            if (scene.drawingDataUrl) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.drawImage(img, 0, 0);
                    renderMainCanvas();
                };
                img.src = scene.drawingDataUrl;
            } else {
                renderMainCanvas();
            }
        }

        // 전체 지우기 확인 모달
        function confirmClearCanvas() {
            showDialog(
                '🧹',
                '도화지를 깨끗이 지울까요?',
                '그린 그림과 붙인 스티커가 모두 사라져요.',
                [
                    { text: '취소', style: 'bg-gray-200 text-gray-700', action: closeDialog },
                    {
                        text: '네, 지울래요!',
                        style: 'bg-[#FF6B6B] text-white',
                        action: () => {
                            drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);
                            scenes[currentSceneIndex].stickers = [];
                            activeStickerIndex = -1;
                            updateStickerHelper();
                            renderMainCanvas();
                            saveCurrentSceneCanvas();
                            playPopSound('C4');
                            closeDialog();
                        }
                    }
                ]
            );
        }

        /* ==========================================================================
           6. 스토리보드 컷(장면) 관리 (선택, 추가, 삭제, 순서 변경)
           ========================================================================== */
        function loadSceneToEditor(index) {
            if (isRecording) stopRecording();
            currentSceneIndex = index;
            activeStickerIndex = -1;
            updateStickerHelper();

            const scene = scenes[index];
            document.getElementById('current-scene-badge').textContent = `${index + 1}번째 장면`;
            document.getElementById('story-text').value = scene.text;

            // 오디오 버튼 상태 업데이트
            updateAudioUI();

            // 캔버스 그림 불러오기
            loadSceneCanvas(index);
            renderStoryboardList();
        }

        function updateSceneText(value) {
            scenes[currentSceneIndex].text = value;
            const previewEl = document.getElementById(`thumb-text-${currentSceneIndex}`);
            if (previewEl) {
                previewEl.textContent = value.trim() || '(이야기를 적어주세요)';
            }
        }

        function addScene() {
            if (scenes.length >= 8) {
                showDialog('📚', '이야기가 가득 찼어요!', '최대 8장면까지 만들 수 있어요.', [
                    { text: '알겠어요', style: 'bg-[#4FB0E8] text-white', action: closeDialog }
                ]);
                return;
            }
            saveCurrentSceneCanvas();
            scenes.push(createEmptyScene(scenes.length + 1));
            playPopSound('E5');
            loadSceneToEditor(scenes.length - 1);
            // 새 컷에 빈 썸네일 저장
            setTimeout(() => saveCurrentSceneCanvas(), 50);
        }

        function deleteScene(index, e) {
            e.stopPropagation();
            if (scenes.length <= 1) {
                showDialog('⚠️', '지울 수 없어요', '최소 1개의 장면은 있어야 해요!', [
                    { text: '확인', style: 'bg-[#4FB0E8] text-white', action: closeDialog }
                ]);
                return;
            }

            showDialog(
                '🗑️',
                `${index + 1}번째 장면을 지울까요?`,
                '이 장면에 그린 그림과 이야기가 삭제됩니다.',
                [
                    { text: '취소', style: 'bg-gray-200 text-gray-700', action: closeDialog },
                    {
                        text: '지우기',
                        style: 'bg-[#FF6B6B] text-white',
                        action: () => {
                            scenes.splice(index, 1);
                            if (currentSceneIndex >= scenes.length) {
                                currentSceneIndex = scenes.length - 1;
                            }
                            playPopSound('C4');
                            loadSceneToEditor(currentSceneIndex);
                            closeDialog();
                        }
                    }
                ]
            );
        }

        function moveScene(index, direction, e) {
            e.stopPropagation();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= scenes.length) return;

            saveCurrentSceneCanvas();
            // 배열 요소 위치 교환
            const temp = scenes[index];
            scenes[index] = scenes[targetIndex];
            scenes[targetIndex] = temp;

            // 현재 선택된 인덱스 추적
            if (currentSceneIndex === index) currentSceneIndex = targetIndex;
            else if (currentSceneIndex === targetIndex) currentSceneIndex = index;

            playPopSound('F5');
            loadSceneToEditor(currentSceneIndex);
        }

        function updateThumbnailUI(index) {
            const imgEl = document.getElementById(`thumb-img-${index}`);
            if (imgEl && scenes[index].thumbnailUrl) {
                imgEl.src = scenes[index].thumbnailUrl;
            }
        }

        function renderStoryboardList() {
            const listEl = document.getElementById('storyboard-list');
            document.getElementById('total-scenes-count').textContent = `총 ${scenes.length}장면`;
            listEl.innerHTML = '';

            scenes.forEach((scene, idx) => {
                const isSelected = idx === currentSceneIndex;
                const card = document.createElement('div');
                card.onclick = () => {
                    if (currentSceneIndex !== idx) {
                        saveCurrentSceneCanvas();
                        playPopSound('C5');
                        loadSceneToEditor(idx);
                    }
                };

                card.className = `flex-shrink-0 w-56 lg:w-full rounded-2xl p-3 cursor-pointer transition-all border-4 ${
                    isSelected 
                    ? 'bg-[#FFFDF0] border-[#FFB703] shadow-md scale-[1.01]' 
                    : 'bg-white border-transparent hover:border-[#95D5B2] shadow-sm'
                }`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-1.5">
                            <span class="w-7 h-7 rounded-full ${isSelected ? 'bg-[#FFB703] text-white' : 'bg-[#D8F3DC] text-[#2D6A4F]'} flex items-center justify-center text-sm font-bold">
                                ${idx + 1}
                            </span>
                            <span class="text-base ${isSelected ? 'text-[#B7791F]' : 'text-gray-600'}">장면 ${idx + 1}</span>
                            ${scene.audioUrl ? '<span title="녹음 있음" class="text-sm">🎤</span>' : ''}
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="moveScene(${idx}, -1, event)" ${idx === 0 ? 'disabled' : ''} class="p-1 rounded-lg bg-gray-100 hover:bg-gray-200 disabled:opacity-30 text-xs" title="앞으로 이동">◀</button>
                            <button onclick="moveScene(${idx}, 1, event)" ${idx === scenes.length - 1 ? 'disabled' : ''} class="p-1 rounded-lg bg-gray-100 hover:bg-gray-200 disabled:opacity-30 text-xs" title="뒤로 이동">▶</button>
                            <button onclick="deleteScene(${idx}, event)" class="p-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 text-xs ml-1" title="장면 삭제">✖</button>
                        </div>
                    </div>
                    <div class="aspect-[4/3] w-full bg-white rounded-xl border-2 border-gray-100 overflow-hidden mb-2 flex items-center justify-center">
                        ${scene.thumbnailUrl 
                            ? `<img id="thumb-img-${idx}" src="${scene.thumbnailUrl}" class="w-full h-full object-contain" alt="장면 ${idx + 1}">`
                            : `<div class="text-gray-300 text-sm font-story">빈 도화지</div>`
                        }
                    </div>
                    <p id="thumb-text-${idx}" class="font-story text-sm text-gray-600 truncate px-1">
                        ${scene.text.trim() || '(이야기를 적어주세요)'}
                    </p>
                `;
                listEl.appendChild(card);
            });
        }

        /* ==========================================================================
           7. 음성 녹음 및 재생 (MediaRecorder API)
           ========================================================================== */
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showDialog('🎤', '마이크를 사용할 수 없어요', '이 브라우저에서는 음성 녹음 기능을 지원하지 않아요. 대신 동화책 보기에서 AI 읽어주기를 사용할 수 있어요!', [
                    { text: '확인', style: 'bg-[#4FB0E8] text-white', action: closeDialog }
                ]);
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    scenes[currentSceneIndex].audioUrl = audioUrl;
                    updateAudioUI();
                    renderStoryboardList();
                    // 마이크 스트림 트랙 종료
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                updateAudioUI();
            } catch (err) {
                showDialog('🎤', '마이크 권한이 필요해요!', '브라우저 상단에서 마이크 사용을 [허용]해 주시면 멋진 목소리를 녹음할 수 있어요.', [
                    { text: '알겠어요', style: 'bg-[#4FB0E8] text-white', action: closeDialog }
                ]);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                playPopSound('E5');
                updateAudioUI();
            }
        }

        function updateAudioUI() {
            const btnRecord = document.getElementById('btn-record');
            const recordIcon = document.getElementById('record-icon');
            const recordLabel = document.getElementById('record-label');
            const btnPlay = document.getElementById('btn-play-audio');
            const statusText = document.getElementById('audio-status');

            const hasAudio = !!scenes[currentSceneIndex].audioUrl;

            if (isRecording) {
                btnRecord.classList.add('recording-pulse', 'bg-red-600');
                recordIcon.textContent = '⏹️';
                recordLabel.textContent = '멈추기';
                btnPlay.disabled = true;
                statusText.textContent = '녹음 중이에요! 이야기를 말해보세요...';
                statusText.className = 'text-xs text-center text-red-600 font-bold';
            } else {
                btnRecord.classList.remove('recording-pulse', 'bg-red-600');
                recordIcon.textContent = '🔴';
                recordLabel.textContent = hasAudio ? '다시 녹음' : '녹음하기';
                btnPlay.disabled = !hasAudio;
                statusText.textContent = hasAudio ? '녹음 완료! 듣기 버튼을 눌러보세요.' : '버튼을 눌러 목소리를 들려주세요!';
                statusText.className = 'text-xs text-center text-gray-500 font-story';
            }
        }

        function playSceneAudio(sceneIdx = currentSceneIndex) {
            const url = scenes[sceneIdx].audioUrl;
            if (!url) return;

            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer.currentTime = 0;
            }
            currentAudioPlayer = new Audio(url);
            currentAudioPlayer.play().catch(() => {});
        }

        /* ==========================================================================
           8. 동화책 보기 (발표 모드 & Web Speech API TTS)
           ========================================================================== */
        function openPresentation() {
            if (isRecording) stopRecording();
            saveCurrentSceneCanvas();
            presentationIndex = 0;
            document.getElementById('presentation-modal').classList.remove('hidden');
            document.getElementById('presentation-modal').classList.add('flex');
            playPopSound('G5');
            renderPresentationPage();
        }

        function closePresentation() {
            if (currentAudioPlayer) currentAudioPlayer.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('presentation-modal').classList.add('hidden');
            document.getElementById('presentation-modal').classList.remove('flex');
        }

        function changePresentationPage(delta) {
            const nextIdx = presentationIndex + delta;
            if (nextIdx < 0 || nextIdx >= scenes.length) return;
            if (currentAudioPlayer) currentAudioPlayer.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            presentationIndex = nextIdx;
            playPopSound('E5');
            renderPresentationPage();
        }

        function renderPresentationPage() {
            const scene = scenes[presentationIndex];
            document.getElementById('pres-page-indicator').textContent = `${presentationIndex + 1} / ${scenes.length}`;
            document.getElementById('pres-image').src = scene.thumbnailUrl || '';
            document.getElementById('pres-text').textContent = scene.text.trim() || '(이 장면에는 적힌 이야기가 없어요)';

            // 녹음 버튼 활성화 여부
            const voiceBtn = document.getElementById('pres-btn-voice');
            if (scene.audioUrl) {
                voiceBtn.classList.remove('hidden');
                // 페이지 넘길 때 녹음된 목소리 자동 재생
                playSceneAudio(presentationIndex);
            } else {
                voiceBtn.classList.add('hidden');
            }

            // 이전/다음 버튼 상태
            document.getElementById('pres-prev-btn').disabled = presentationIndex === 0;
            document.getElementById('pres-next-btn').disabled = presentationIndex === scenes.length - 1;
        }

        function playPresentationVoice() {
            playSceneAudio(presentationIndex);
        }

        // Web Speech API를 활용한 한국어 동화책 읽어주기
        function speakPresentationTTS() {
            const text = scenes[presentationIndex].text.trim();
            if (!text) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.92; // 저학년이 듣기 편한 약간 느린 속도
                utterance.pitch = 1.15; // 따뜻하고 밝은 톤
                window.speechSynthesis.speak(utterance);
            }
        }

        /* ==========================================================================
           9. 커스텀 알림/확인 모달 제어
           ========================================================================== */
        function showDialog(icon, title, message, buttons) {
            document.getElementById('dialog-icon').textContent = icon;
            document.getElementById('dialog-title').textContent = title;
            document.getElementById('dialog-message').textContent = message;

            const btnContainer = document.getElementById('dialog-buttons');
            btnContainer.innerHTML = '';
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `jelly-btn px-5 py-2.5 rounded-2xl text-lg font-bold shadow-sm ${b.style}`;
                btn.textContent = b.text;
                btn.onclick = b.action;
                btnContainer.appendChild(btn);
            });

            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
        }

        function closeDialog() {
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
        }
    </script>
</body>
</html>
